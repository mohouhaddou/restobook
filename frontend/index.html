  <style>
  /* ═══════════════════════════════════════════════════════════════
     DESIGN TOKENS
  ═══════════════════════════════════════════════════════════════ */
  :root {
    /* ── Ifilino Brand Tokens ── */
    --il-primary:         #FF8A00;
    --il-primary-dark:    #E67200;
    --il-primary-light:   rgba(255,138,0,.12);
    --il-primary-lighter: rgba(255,138,0,.07);
    --il-secondary:       #FF6A00;
    --il-secondary-dark:  #E55E00;
    --il-dark:            #08111F;
    --il-accent:          #FF3B30;
    --il-gradient:        linear-gradient(135deg, #FF8A00 0%, #FF3B30 100%);
    --il-gradient-dark:   linear-gradient(160deg, #08111F, #111F35);
    --il-bg:              #F8FAFC;
    --il-bg2:             #EFF4FB;
    --il-surface:         #FFFFFF;
    --il-card:            #FFFFFF;
    --il-text:            #0F172A;
    --il-text2:           #334155;
    --il-muted:           #64748B;
    --il-subtle:          #94A3B8;
    --il-border:          #E2E8F0;
    --il-border2:         #F1F5F9;
    --il-shadow:          0 4px 16px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.04);
    --il-shadow-md:       0 8px 32px rgba(0,0,0,.09);
    --il-shadow-lg:       0 16px 64px rgba(0,0,0,.10);
    --il-radius-xs:       6px;
    --il-radius-sm:       10px;
    --il-radius:          14px;
    --il-radius-lg:       20px;
    --il-transition:      150ms cubic-bezier(0.4,0,0.2,1);
    --il-font:            'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
    --il-font-display:    'Poppins', var(--il-font);
    --il-success:         #22C55E;
    --il-warning:         #F59E0B;
    --il-danger:          #EF4444;
    --il-info:            #06B6D4;
    --il-sidebar-w:       260px;
    --il-navbar-h:        64px;

    /* Brand tokens (Ifilino) */
    --rb-orange:        var(--il-primary);
    --rb-deep-orange:   var(--il-secondary);
    --rb-orange-light:  var(--il-primary-light);
    --rb-orange-hover:  var(--il-primary-dark);
    --rb-orange-muted:  var(--il-primary-lighter);
    --rb-accent:        var(--il-accent);
    --rb-gradient:      var(--il-gradient);

    /* Secondary accents */
    --rb-blue:   #3B82F6;
    --rb-blue-s: #EFF6FF;
    --rb-green:  var(--il-success);
    --rb-green-s:#F0FDF4;

    /* ── Ifilino Sidebar ── */
    --sb-bg:          #08111F;
    --sb-border:      rgba(255,255,255,.08);
    --sb-text:        rgba(255,255,255,.65);
    --sb-text-hover:  rgba(255,255,255,.95);
    --sb-active-bg:   var(--il-primary);
    --sb-active-text: #FFFFFF;
    --sb-section:     #FF8A00;
    --sb-width:       260px;

    /* ── Topbar ── */
    --tb-height: 60px;
    --tb-bg:     #FFFFFF;
    --tb-border: #E8ECF0;

    /* ── Content neutrals ── */
    --rb-bg:       var(--il-bg);
    --rb-card:     var(--il-card);
    --rb-border:   var(--il-border);
    --rb-text:     var(--il-text);
    --rb-text2:    var(--il-text2);
    --rb-muted:    var(--il-muted);
    --rb-muted-2:  var(--il-subtle);
    --rb-surface:  var(--il-bg2);
    --rb-surface-2:var(--il-border);
    --rb-shadow:   var(--il-shadow);
    --rb-shadow-md:var(--il-shadow-md);
    --rb-shadow-lg:var(--il-shadow-lg);
    --rb-radius:   var(--il-radius);
    --rb-radius-sm:var(--il-radius-sm);
    --rb-radius-lg:var(--il-radius-lg);

    /* ── Semantic colors ── */
    --rb-success:    #16A34A;
    --rb-success-bg: #F0FDF4;
    --rb-success-s:  rgba(22,163,74,.12);
    --rb-danger:     #DC2626;
    --rb-danger-bg:  #FEF2F2;
    --rb-danger-s:   rgba(220,38,38,.1);
    --rb-warning:    #D97706;
    --rb-warning-bg: #FFFBEB;
    --rb-warning-s:  rgba(245,158,11,.12);
    --rb-info:       #2563EB;
    --rb-info-bg:    #EFF6FF;
    --rb-info-s:     rgba(59,130,246,.12);
    --rb-purple:     #7C3AED;
    --rb-purple-s:   rgba(124,58,237,.1);

    /* ── Elevation ── */
    --rb-shadow:    0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
    --rb-shadow-md: 0 4px 16px rgba(0,0,0,.10), 0 1px 4px rgba(0,0,0,.06);
    --rb-shadow-lg: 0 12px 40px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.06);

    /* ── Border-radius ── */
    --rb-radius:    12px;
    --rb-radius-sm: 8px;
    --rb-radius-lg: 16px;
  }

  /* ═══════════════════════════════════════════════════════════════
     BASE
  ═══════════════════════════════════════════════════════════════ */
  *, *::before, *::after { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    font-family: var(--il-font);
    font-size: 14px;
    line-height: 1.6;
    color: var(--il-text);
    background: var(--il-bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ═══════════════════════════════════════════════════════════════
     APP SHELL — fixed sidebar layout
  ═══════════════════════════════════════════════════════════════ */
  .app-shell {
    display: flex;
    min-height: 100vh;
    background: var(--il-bg);
  }
  .app-sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: var(--sb-width);
    height: 100vh;
    background: var(--il-gradient-dark);
    border-right: 1px solid var(--sb-border);
    display: flex;
    flex-direction: column;
    z-index: 200;
    overflow: hidden;
    transition: transform .25s cubic-bezier(.4,0,.2,1);
    box-shadow: var(--il-shadow-lg);
  }
  .app-main {
    flex: 1;
    margin-left: var(--sb-width);
    width: calc(100% - var(--sb-width));
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-width: 0;
  }
  [dir="rtl"] .app-shell { direction: rtl; }
  [dir="rtl"] .app-sidebar {
    left: auto;
    right: 0;
    border-right: 0;
    border-left: 1px solid var(--sb-border);
  }
  [dir="rtl"] .app-main {
    margin-left: 0;
    margin-right: var(--sb-width);
  }
  .app-topbar {
    position: sticky;
    top: 0; z-index: 100;
    height: var(--tb-height);
    background: var(--tb-bg);
    border-bottom: 1px solid var(--tb-border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 12px;
    flex-shrink: 0;
    box-shadow: 0 1px 0 var(--tb-border);
  }
  .app-content {
    flex: 1;
    padding: 24px;
    background: var(--rb-bg);
    display: grid;
    gap: 20px;
    align-content: start;
    min-width: 0;
  }
  /* Empêche une grille interne (ex: minmax(280px,1fr)) de forcer toute la page
     à s'élargir au-delà du viewport au lieu de passer à une seule colonne —
     par défaut un enfant de grid garde min-width:auto (taille de son contenu). */
  .app-content > * { min-width: 0; }
  html, body { overflow-x: hidden; }
  @media (max-width: 991px) {
    .app-main  { margin-left: 0; margin-right: 0; width: 100%; }
    .app-sidebar { transform: translateX(-100%); box-shadow: none; }
    [dir="rtl"] .app-sidebar { transform: translateX(100%); }
    .app-sidebar.open { transform: translateX(0); box-shadow: 8px 0 40px rgba(0,0,0,.5); }
    .app-content { padding: 16px; }
  }
  .app-sidebar-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    z-index: 199;
    backdrop-filter: blur(2px);
  }
  .app-sidebar-backdrop.open { display: block; }

  /* ═══════════════════════════════════════════════════════════════
     SIDEBAR NAV ITEMS
  ═══════════════════════════════════════════════════════════════ */
  .sb-nav-section {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--sb-section);
    padding: 14px 12px 4px;
    display: block;
  }
  .sb-nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: var(--rb-radius-sm);
    font-size: 13px; font-weight: 500;
    color: var(--sb-text);
    cursor: pointer; border: none; background: transparent;
    width: 100%; text-align: left;
    transition: background .12s, color .12s;
    text-decoration: none; line-height: 1.4;
  }
  .sb-nav-item:hover { background: rgba(255,255,255,.06); color: var(--sb-text-hover); text-decoration: none; }
  [dir="rtl"] .sb-nav-item { text-align: start; justify-content: flex-start; }
  .sb-nav-item.active, .sb-nav-item[aria-current="page"] {
    background: var(--il-primary) !important;
    color: var(--il-dark) !important;
    font-weight: 700 !important;
    box-shadow: 0 4px 16px rgba(255,138,0,.25);
  }

  /* ═══════════════════════════════════════════════════════════════
     TOPBAR ICON BUTTON
  ═══════════════════════════════════════════════════════════════ */
  .tb-icon-btn {
    width: 38px; height: 38px;
    border-radius: var(--rb-radius-sm);
    border: 1px solid var(--rb-border);
    background: transparent; color: var(--rb-muted);
    display: grid; place-items: center;
    cursor: pointer; transition: background .12s, color .12s;
    padding: 0; position: relative;
  }
  .tb-icon-btn:hover { background: var(--rb-surface); color: var(--rb-text); }

  /* ═══════════════════════════════════════════════════════════════
     CARDS
  ═══════════════════════════════════════════════════════════════ */
  .card {
    background: var(--rb-card);
    border: 1px solid var(--rb-border) !important;
    border-radius: var(--rb-radius) !important;
    box-shadow: var(--rb-shadow);
  }
  .card-header {
    background: var(--rb-surface) !important;
    border-bottom: 1px solid var(--rb-border) !important;
    border-radius: calc(var(--rb-radius) - 1px) calc(var(--rb-radius) - 1px) 0 0 !important;
    padding: 14px 20px !important;
  }
  .card-body { padding: 20px !important; }
  .card-footer {
    padding: 12px 20px !important;
    background: var(--rb-surface) !important;
    border-top: 1px solid var(--rb-border) !important;
  }

  /* ═══════════════════════════════════════════════════════════════
     BUTTONS
  ═══════════════════════════════════════════════════════════════ */
  .btn { border-radius: var(--rb-radius-sm) !important; font-weight: 500; transition: all .15s; font-size: 13px; }
  .btn:active { transform: scale(.98); }
  .btn-xs { padding: 2px 8px !important; font-size: 11px !important; }
  .btn-primary { background: var(--il-gradient) !important; border-color: transparent !important; color: #fff !important; font-weight: 600; }
  .btn-primary:hover, .btn-primary:focus {
    background: linear-gradient(135deg, var(--il-primary-dark), var(--il-secondary-dark)) !important;
    box-shadow: 0 8px 24px rgba(255,138,0,.35) !important;
    transform: translateY(-1px);
  }
  .btn-outline-primary { border-color: var(--il-primary) !important; color: var(--il-primary) !important; }
  .btn-outline-primary:hover { background: var(--il-primary-lighter) !important; color: var(--il-primary-dark) !important; }

  /* ═══════════════════════════════════════════════════════════════
     INPUTS
  ═══════════════════════════════════════════════════════════════ */
  .form-control, .form-select {
    border: 1px solid var(--rb-border) !important;
    border-radius: var(--rb-radius-sm) !important;
    background: var(--rb-card) !important;
    color: var(--rb-text) !important;
    font-size: 13px;
    transition: border-color .15s, box-shadow .15s;
  }
  .form-control:focus, .form-select:focus {
    border-color: var(--il-primary) !important;
    box-shadow: 0 0 0 3px var(--il-primary-lighter) !important;
  }
  .form-label {
    font-size: 12px; font-weight: 600; color: var(--rb-muted);
    text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px;
  }

  /* ═══════════════════════════════════════════════════════════════
     STAT CARDS
  ═══════════════════════════════════════════════════════════════ */
  .stat-card {
    border-radius: var(--rb-radius) !important;
    border: 1px solid var(--rb-border) !important;
    box-shadow: var(--rb-shadow); background: var(--rb-card);
    padding: 20px 22px;
    transition: box-shadow .2s, transform .2s;
  }
  .stat-card:hover { box-shadow: var(--rb-shadow-md); transform: translateY(-1px); }
  .stat-card__icon { width:42px; height:42px; border-radius:10px; display:grid; place-items:center; margin-bottom:14px; font-size:20px; }
  .stat-card__value { font-size:30px; font-weight:700; line-height:1; letter-spacing:-.5px; }
  .stat-card__label { font-size:12px; color:var(--rb-muted); margin-top:6px; font-weight:500; }
  .stat-card__delta {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600; margin-top: 8px; padding: 2px 8px; border-radius: 20px;
  }
  .stat-card__delta--up   { background:var(--rb-green-s); color:var(--rb-green); }
  .stat-card__delta--down { background:#FEF2F2; color:#DC2626; }
  .stat-card__delta--flat { background:var(--rb-surface); color:var(--rb-muted); }

  /* ═══════════════════════════════════════════════════════════════
     PAGE HEADERS & SECTION TITLES
  ═══════════════════════════════════════════════════════════════ */
  .page-header { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .page-title { font-size:20px; font-weight:700; color:var(--rb-text); margin:0; letter-spacing:-.3px; }
  .page-subtitle { font-size:13px; color:var(--rb-muted); margin:2px 0 0; }
  .section-title { font-size:15px; font-weight:700; color:var(--rb-text); letter-spacing:-.2px; margin:0; }

  /* ═══════════════════════════════════════════════════════════════
     TABLES
  ═══════════════════════════════════════════════════════════════ */
  .rb-table { border-collapse:separate; border-spacing:0; width:100%; }
  .rb-table th {
    background:var(--rb-surface); font-size:11px; font-weight:700;
    text-transform:uppercase; letter-spacing:.06em; color:var(--rb-muted);
    padding:10px 16px; border-bottom:1px solid var(--rb-border); white-space:nowrap;
  }
  .rb-table td { padding:12px 16px; border-bottom:1px solid var(--rb-border); font-size:13px; vertical-align:middle; }
  .rb-table tbody tr:last-child td { border-bottom:none; }
  .rb-table tbody tr { transition:background .1s; }
  .rb-table tbody tr:hover td { background:var(--rb-surface); }

  /* ═══════════════════════════════════════════════════════════════
     BADGES
  ═══════════════════════════════════════════════════════════════ */
  .rb-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; white-space:nowrap; }
  .rb-badge::before { content:''; width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .rb-badge--orange  { background:var(--rb-orange-light); color:var(--rb-orange); }
  /* Semantic color utilities — use these instead of hardcoding #DC2626 etc. */
  .rb-success  { color: var(--rb-success) !important; }
  .rb-danger   { color: var(--rb-danger)  !important; }
  .rb-warning  { color: var(--rb-warning) !important; }
  .rb-info     { color: var(--rb-info)    !important; }
  .rb-bg-success { background: var(--rb-success-s) !important; }
  .rb-bg-danger  { background: var(--rb-danger-s)  !important; }
  .rb-bg-warning { background: var(--rb-warning-s) !important; }
  .rb-bg-info    { background: var(--rb-info-s)    !important; }
  .rb-badge--orange::before { background:var(--rb-orange); }
  .rb-badge--green  { background:var(--rb-green-s);  color:var(--rb-green); }
  .rb-badge--green::before  { background:var(--rb-green); }
  .rb-badge--red    { background:#FEF2F2; color:#DC2626; }
  .rb-badge--red::before    { background:#DC2626; }
  .rb-badge--gray   { background:var(--rb-surface); color:var(--rb-muted); }
  .rb-badge--gray::before   { background:var(--rb-muted-2); }
  .rb-badge--blue   { background:var(--rb-blue-s);  color:var(--rb-blue); }
  .rb-badge--blue::before   { background:var(--rb-blue); }
  .rb-badge--yellow { background:#FEFCE8; color:#CA8A04; }
  .rb-badge--yellow::before { background:#CA8A04; }
  .rb-badge--purple { background:#F5F3FF; color:#7C3AED; }
  .rb-badge--purple::before { background:#7C3AED; }

  /* ═══════════════════════════════════════════════════════════════
     EMPTY STATES & SKELETON
  ═══════════════════════════════════════════════════════════════ */
  .empty-state { padding:48px 24px; text-align:center; color:var(--rb-muted); }
  .empty-state__icon { font-size:48px; margin-bottom:16px; line-height:1; }
  .empty-state__title { font-size:15px; font-weight:700; color:var(--rb-text); margin-bottom:6px; }
  .empty-state__desc  { font-size:13px; color:var(--rb-muted); max-width:320px; margin:0 auto; }

  .skeleton {
    background: linear-gradient(90deg, var(--rb-surface) 25%, var(--rb-surface-2) 50%, var(--rb-surface) 75%);
    background-size: 200% 100%;
    animation: skeleton-shimmer 1.4s infinite;
    border-radius: var(--rb-radius-sm);
  }
  @keyframes skeleton-shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ═══════════════════════════════════════════════════════════════
     FOOD CARDS
  ═══════════════════════════════════════════════════════════════ */
  .food-card {
    border-radius:var(--rb-radius) !important; border:2px solid transparent !important;
    box-shadow:var(--rb-shadow); overflow:hidden; cursor:pointer;
    transition:transform .15s,box-shadow .15s,border-color .15s; background:var(--rb-card);
  }
  .food-card:hover { transform:translateY(-2px); box-shadow:var(--rb-shadow-md); }
  .food-card.selected { border-color:var(--rb-orange) !important; box-shadow:0 0 0 3px rgba(255,138,0,.15),var(--rb-shadow-md); }
  .food-card.disabled { opacity:.55; pointer-events:none; }
  .food-card__img { width:100%; aspect-ratio:4/3; object-fit:cover; background:var(--rb-surface); display:block; }
  .food-card__check {
    position:absolute; top:8px; right:8px; width:28px; height:28px;
    background:var(--rb-gradient); color:#fff; border-radius:50%;
    display:grid; place-items:center; font-size:14px; font-weight:700;
    box-shadow:0 4px 12px rgba(255,138,0,.4); animation:popIn .15s ease-out;
  }
  @keyframes popIn { from{transform:scale(.5);opacity:0} to{transform:scale(1);opacity:1} }
  .food-card__badge { display:inline-flex; align-items:center; background:var(--rb-orange-light); color:var(--rb-orange); border-radius:20px; padding:2px 8px; font-size:11px; font-weight:600; }
  .food-card__badge--green { background:var(--rb-green-s); color:var(--rb-green); }
  .food-card__badge--red   { background:#FEF2F2; color:#DC2626; }
  .food-card__badge--gray  { background:var(--rb-surface); color:var(--rb-muted); }

  /* ═══════════════════════════════════════════════════════════════
     ORDER CARDS
  ═══════════════════════════════════════════════════════════════ */
  .order-card { border:1px solid var(--rb-border); border-radius:var(--rb-radius); background:var(--rb-card); overflow:hidden; box-shadow:var(--rb-shadow); transition:box-shadow .15s; }
  .order-card:hover { box-shadow:var(--rb-shadow-md); }
  .order-card__header { padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--rb-border); background:var(--rb-surface); flex-wrap:wrap; }
  .order-card__body { padding:12px 18px; }
  .order-item-chip { display:inline-flex; align-items:center; gap:6px; background:var(--rb-surface); border:1px solid var(--rb-border); border-radius:var(--rb-radius-sm); padding:5px 10px; font-size:12px; }
  .order-item-chip__cat { font-size:10px; font-weight:700; color:var(--rb-muted); text-transform:uppercase; letter-spacing:.04em; }

  /* ═══════════════════════════════════════════════════════════════
     CATEGORY TABS
  ═══════════════════════════════════════════════════════════════ */
  .cat-tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .cat-tab { flex-shrink:0; padding:6px 16px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; border:1.5px solid var(--rb-border); background:var(--rb-card); color:var(--rb-muted); transition:all .12s; }
  .cat-tab.active { background:var(--rb-gradient); border-color:var(--rb-orange); color:#fff; box-shadow:0 2px 8px rgba(255,138,0,.3); }
  .cat-tab:hover:not(.active) { border-color:var(--rb-orange); color:var(--rb-orange); }

  /* ═══════════════════════════════════════════════════════════════
     AVATAR
  ═══════════════════════════════════════════════════════════════ */
  .avatar { border-radius:50%; background:var(--il-gradient); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; box-shadow: 0 2px 8px rgba(255,138,0,.25); }

  /* ═══════════════════════════════════════════════════════════════
     HERO
  ═══════════════════════════════════════════════════════════════ */
  .rb-hero { border-radius:var(--rb-radius-lg); overflow:hidden; position:relative; aspect-ratio:16/5; background:#1C1917; margin-bottom:20px; }
  .rb-hero__overlay { position:absolute; inset:0; background:linear-gradient(135deg,rgba(15,10,5,.75) 0%,rgba(255,138,0,.2) 100%); }
  .rb-hero__content { position:relative; z-index:1; padding:28px 32px; height:100%; display:flex; flex-direction:column; justify-content:flex-end; }
  .rb-hero__title { font-family:'Poppins',sans-serif;font-weight:700; font-size:clamp(20px,3vw,34px); color:#fff; margin:0; line-height:1.2; }
  .rb-hero__sub { color:rgba(255,255,255,.8); font-size:13px; margin-top:4px; }

  /* ═══════════════════════════════════════════════════════════════
     LOGIN PAGE
  ═══════════════════════════════════════════════════════════════ */
  .rb-login-wrap { min-height:100vh; display:flex; }
  .rb-login-panel { width:100%; max-width:460px; padding:48px 40px; display:flex; flex-direction:column; justify-content:center; background:var(--rb-card); overflow-y:auto; }
  .rb-login-image { flex:1; position:relative; overflow:hidden; min-height:260px; }
  .rb-login-image img { width:100%; height:100%; object-fit:cover; }
  .rb-login-image__overlay { position:absolute; inset:0; background:linear-gradient(160deg,rgba(15,10,5,.25) 0%,rgba(15,10,5,.65) 100%); }
  .rb-login-image__quote { position:absolute; bottom:48px; left:40px; right:40px; z-index:1; color:#fff; }
  .rb-login-image__quote-text { font-family:'Poppins',sans-serif;font-weight:700; font-size:clamp(16px,2vw,22px); line-height:1.4; text-shadow:0 2px 8px rgba(0,0,0,.4); }
  .rb-login-image__quote-author { font-size:13px; opacity:.75; margin-top:8px; text-shadow:0 1px 4px rgba(0,0,0,.4); }
  @media (max-width: 767px) { .rb-login-image { display:none; } .rb-login-panel { max-width:100%; padding:40px 24px; } }

  /* ═══════════════════════════════════════════════════════════════
     LEGACY COMPAT (rb-navbar, rb-sidebar for non-redesigned pages)
  ═══════════════════════════════════════════════════════════════ */
  .rb-navbar { background:var(--rb-card) !important; border:1px solid var(--rb-border) !important; border-radius:var(--rb-radius) !important; box-shadow:var(--rb-shadow); padding:10px 16px; margin-bottom:16px; }
  .rb-logo-name { font-family:'Poppins',sans-serif;font-weight:700; font-size:20px; color:var(--rb-orange); letter-spacing:-.3px; }
  .rb-sidebar { position:sticky; top:12px; max-height:calc(100vh - 24px); overflow-y:auto; scrollbar-width:thin; }
  .rb-nav-item { display:flex; align-items:center; gap:10px; padding:9px 14px; border-radius:var(--rb-radius-sm); font-size:13px; font-weight:500; color:var(--rb-muted); cursor:pointer; border:none; background:transparent; width:100%; text-align:left; transition:background .12s,color .12s; text-decoration:none; }
  .rb-nav-item:hover { background:var(--rb-surface); color:var(--rb-text); }
  .rb-nav-item.active, .rb-nav-item[aria-current="page"] { background:var(--rb-orange-light); color:var(--rb-orange); }
  .rb-nav-section { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--rb-muted-2); padding:8px 14px 4px; }

  /* ═══════════════════════════════════════════════════════════════
     BOOTSTRAP OVERRIDES
  ═══════════════════════════════════════════════════════════════ */
  .table > :not(caption) > * > * { background-color:transparent !important; }
  .list-group-item { border-color:var(--rb-border) !important; }
  .dropdown-menu { border:1px solid var(--rb-border) !important; border-radius:var(--rb-radius) !important; box-shadow:var(--rb-shadow-lg) !important; padding:6px !important; }
  .dropdown-item { border-radius:var(--rb-radius-sm) !important; font-size:13px; padding:8px 12px !important; }
  .dropdown-item:hover { background:var(--rb-surface) !important; }
  .alert { border-radius:var(--rb-radius-sm) !important; border:none !important; }
  .modal-content { border-radius:var(--rb-radius) !important; border:none !important; box-shadow:var(--rb-shadow-lg) !important; }
  .modal-header { border-bottom:1px solid var(--rb-border) !important; padding:16px 20px !important; }
  .modal-body   { padding:20px !important; }
  .modal-footer { border-top:1px solid var(--rb-border) !important; padding:14px 20px !important; }

  /* ── Marketplace Design System ───────────────────────────────────────── */
  .mk-wrap { font-family: Inter,system-ui,sans-serif; }
  .mk-wrap.mk-light {
    --mk-bg:       #F8FAFC;
    --mk-surface:  #FFFFFF;
    --mk-card:     #FFFFFF;
    --mk-card-hover: #FAFBFC;
    --mk-text:     #0F172A;
    --mk-text2:    #374151;
    --mk-muted:    #64748B;
    --mk-border:   #E2E8F0;
    --mk-border2:  #F1F5F9;
    --mk-shadow:   0 2px 12px rgba(0,0,0,.06);
    --mk-shadow-md:0 4px 24px rgba(0,0,0,.08);
    --mk-shadow-lg:0 12px 48px rgba(0,0,0,.12);
    --mk-input-bg: #FFFFFF;
    --mk-pill:     #F1F5F9;
    --mk-pill-text:#374151;
    --mk-hero-overlay: rgba(15,23,42,.42);
    --mk-hero-gradient: linear-gradient(135deg, rgba(255,138,0,.85), rgba(230,114,0,.5));
    --mk-orange:   var(--il-primary);
    --mk-orange-light: rgba(255,138,0,.08);
    --mk-green:    #16A34A;
    --mk-green-light: rgba(22,163,74,.1);
    --mk-red:      #DC2626;
    --mk-map-filter: none;
  }
  .mk-wrap.mk-dark {
    --mk-bg:       #08111F;
    --mk-surface:  #0F172A;
    --mk-card:     #162032;
    --mk-card-hover:#1A2640;
    --mk-text:     #E2E8F0;
    --mk-text2:    #CBD5E1;
    --mk-muted:    #94A3B8;
    --mk-border:   rgba(148,163,184,.12);
    --mk-border2:  rgba(148,163,184,.07);
    --mk-shadow:   0 2px 12px rgba(0,0,0,.4);
    --mk-shadow-md:0 4px 24px rgba(0,0,0,.5);
    --mk-shadow-lg:0 12px 48px rgba(0,0,0,.6);
    --mk-input-bg: rgba(15,23,42,.8);
    --mk-pill:     rgba(148,163,184,.1);
    --mk-pill-text:#94A3B8;
    --mk-hero-overlay: rgba(7,13,26,.55);
    --mk-hero-gradient: linear-gradient(135deg, rgba(230,114,0,.8), rgba(120,50,0,.55));
    --mk-orange:   var(--il-primary);
    --mk-orange-light: rgba(255,138,0,.12);
    --mk-green:    #22C55E;
    --mk-green-light: rgba(34,197,94,.12);
    --mk-red:      #EF4444;
    --mk-map-filter: invert(1) hue-rotate(180deg);
  }

  /* Animations marketplace */
  @keyframes mk-fadeUp   { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
  @keyframes mk-fadeIn   { from{opacity:0} to{opacity:1} }
  @keyframes mk-shimmer  { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  @keyframes mk-heartPop { 0%,100%{transform:scale(1)} 50%{transform:scale(1.35)} }
  @keyframes mk-spin     { to{transform:rotate(360deg)} }
  @keyframes mk-slideIn  { from{transform:translateX(100%)} to{transform:translateX(0)} }
  @keyframes mk-slideInLeft { from{transform:translateX(-100%)} to{transform:translateX(0)} }

  .mk-fade-up   { animation: mk-fadeUp  .4s ease both; }
  .mk-fade-in   { animation: mk-fadeIn  .3s ease both; }
  .mk-spin      { animation: mk-spin .8s linear infinite; }

  /* Restaurant card */
  .mk-card {
    background: var(--mk-card);
    border: 1px solid var(--mk-border);
    border-radius: 18px;
    box-shadow: var(--mk-shadow);
    cursor: pointer;
    overflow: hidden;
    transition: transform .22s cubic-bezier(.4,0,.2,1), box-shadow .22s;
    will-change: transform;
  }
  .mk-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--mk-shadow-lg);
    background: var(--mk-card-hover);
  }

  /* Bloc "Pharmacies de garde" */
  .mk-guard-btn { transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
  .mk-guard-btn:hover { transform: translateY(-2px); }
  @media (max-width: 640px) {
    .mk-guard-block { flex-direction: column; align-items: flex-start !important; text-align: left; }
    .mk-guard-block > div:last-child { width: 100%; }
    .mk-guard-block .mk-guard-btn { flex: 1; }
  }

  /* Carte pharmacie : actions rapides */
  .mk-pharma-actions button { transition: transform .15s ease, background .15s ease; }
  .mk-pharma-actions button:hover { transform: translateY(-1px); }

  /* Skeleton loading */
  .mk-skeleton {
    background: linear-gradient(90deg, var(--mk-border) 25%, var(--mk-border2) 50%, var(--mk-border) 75%);
    background-size: 200% 100%;
    animation: mk-shimmer 1.4s infinite;
    border-radius: 8px;
  }

  /* Pill filter button */
  .mk-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 7px 14px; border-radius: 24px;
    border: 1.5px solid var(--mk-border);
    background: var(--mk-surface);
    color: var(--mk-muted);
    font-size: 12px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
    transition: all .15s;
  }
  .mk-pill:hover { border-color: var(--mk-orange); color: var(--mk-orange); }
  .mk-pill.active {
    border-color: var(--mk-orange);
    background: var(--mk-orange-light);
    color: var(--mk-orange);
  }

  /* Leaflet customization */
  .mk-wrap .leaflet-container { font-family: inherit; border-radius: 16px; }
  .mk-wrap.mk-dark .leaflet-tile-pane { filter: var(--mk-map-filter); }
  .mk-popup {
    min-width: 200px; padding: 0; border-radius: 14px; overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,.2);
  }
  .leaflet-popup-content-wrapper { border-radius: 14px !important; padding: 0 !important; border: none !important; }
  .leaflet-popup-content { margin: 0 !important; }
  .leaflet-popup-tip { background: var(--mk-card) !important; }

  /* Marqueurs emoji (useLeafletMap) — module delivery : Leaflet applique un
     fond blanc + bordure par défaut aux divIcon, qu'on retire pour un rendu
     emoji propre. Volontairement global (pas scopé .mk-wrap) : utilisé aussi
     dans DeliveryPage/OrderTrackingPage qui ne sont pas dans ce wrapper. */
  .dv-marker { background: transparent !important; border: none !important; font-size: 26px; text-align: center; line-height: 32px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); }

  /* Scrollbar thin */
  .mk-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
  .mk-scroll::-webkit-scrollbar-track { background: transparent; }
  .mk-scroll::-webkit-scrollbar-thumb { background: var(--mk-border); border-radius: 4px; }

  /* ══════════════════════════════════════════════════════════
     RESPONSIVE GLOBAL — Marketplace / Restaurant / Checkout
  ══════════════════════════════════════════════════════════ */
  .ifm-nav {
    position: sticky;
    top: 0;
    z-index: 320;
    background: rgba(255,255,255,.94);
    border-bottom: 1px solid var(--mk-border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .ifm-nav-inner {
    max-width: 1280px;
    margin: 0 auto;
    min-height: 104px;
    padding: 0 clamp(14px,4vw,32px);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .ifm-nav-brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--mk-text);
    text-decoration: none;
    flex-shrink: 0;
  }
  .ifm-nav-brand:hover { color: var(--mk-text); text-decoration: none; }
  .ifm-nav-logo { height: 96px !important; max-width: 260px; }
  .ifm-nav-name { display: flex; flex-direction: column; line-height: 1.05; }
  .ifm-nav-name em { font-style: normal; font-size: 11px; font-weight: 900; color: var(--mk-orange); text-transform: uppercase; letter-spacing: .08em; }
  .ifm-nav-links {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }
  .ifm-nav-link {
    min-height: 40px;
    display: inline-flex;
    align-items: center;
    padding: 0 12px;
    border-radius: 10px;
    color: var(--mk-text2);
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }
  .ifm-nav-link:hover { background: var(--mk-pill); color: var(--mk-text); text-decoration: none; }
  .ifm-nav-link.active { background: var(--mk-orange-light); color: var(--mk-orange); }
  .ifm-nav-more { position: relative; flex-shrink: 0; }
  .ifm-nav-more > summary { list-style: none; cursor: pointer; }
  .ifm-nav-more > summary::-webkit-details-marker { display: none; }
  .ifm-nav-more-trigger::after { content: '▾'; margin-left: 6px; font-size: 10px; line-height: 1; }
  .ifm-nav-more-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 190px;
    padding: 8px;
    border: 1px solid var(--mk-border);
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 18px 45px rgba(15,23,42,.14);
    display: grid;
    gap: 2px;
  }
  .ifm-nav-more-link {
    min-height: 38px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    border-radius: 8px;
    color: var(--mk-text2);
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }
  .ifm-nav-more-link:hover,
  .ifm-nav-more-link.active { background: var(--mk-orange-light); color: var(--mk-orange); text-decoration: none; }
  .ifm-nav-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }
  .ifm-nav-ghost,
  .ifm-nav-primary {
    min-height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 800;
    text-decoration: none;
    white-space: nowrap;
  }
  .ifm-nav-ghost { color: var(--mk-text2); border: 1px solid var(--mk-border); }
  .ifm-nav-primary { color: #fff; background: var(--mk-orange); box-shadow: 0 8px 20px rgba(234,88,12,.22); }
  .ifm-nav-ghost:hover { color: var(--mk-orange); text-decoration: none; }
  .ifm-nav-primary:hover { color: #fff; text-decoration: none; transform: translateY(-1px); }
  .ai-button {
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 36px;
  }
  .ai-button.btn-xs { min-height: 30px; }
  .ai-button-spinner {
    border-color: rgba(148,163,184,.45);
    border-top-color: currentColor;
    flex: 0 0 auto;
  }
  .ai-button-loading { cursor: wait !important; }


  /* ── Marketplace : logo icon-only on mobile ── */
  .mk-logo-full { display: block; }
  .mk-logo-icon { display: none; }

  /* ── Marketplace split layout (40 % liste / 60 % carte) ── */
  .mk-map-layout {
    display: grid;
    grid-template-columns: 40% 1fr;
    gap: 0;
    height: 72vh;
    min-height: 500px;
  }
  .mk-map-list { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px; border-right: 1px solid var(--mk-border); }
  .mk-map-container { overflow: hidden; border-radius: 0; box-shadow: none; border: none; }

  /* ── Restaurant page : main content grid ── */
  .rp-main-grid {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px clamp(14px,4vw,32px) 80px;
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 32px;
    align-items: start;
  }
  /* Sidebar cart desktop */
  .rp-cart-col { display: block; }

  /* ── Checkout layout ── */
  .co-layout {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 20px 100px;
    display: flex;
    gap: 28px;
    align-items: flex-start;
  }
  .co-form { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .co-sidebar {
    width: 320px;
    flex-shrink: 0;
    position: sticky;
    top: 80px;
  }
  .co-name-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ══════════════════════════════════════════════════════════
     BREAKPOINTS RESPONSIVE
  ══════════════════════════════════════════════════════════ */

  /* ── Tablette 1024px ── */
  @media (max-width: 1024px) {
    .rp-main-grid { grid-template-columns: 1fr 260px; gap: 24px; }
  }

  /* ── Mode carte actif : masquer le hero sur mobile ── */
  .mk-wrap.mk-mapview .mk-hero { display: none; }

  /* ── Hero Manager : composition premium façon Glovo/Uber Eats/Apple/Airbnb ──
     Forme courbée fine en dégradé (SVG) + colonne texte + décor flottant à
     droite (badge remise + carte "Catégories populaires"), qui bascule en mise
     en page empilée sur mobile (texte en haut sur la forme, décor masqué pour
     garder le CTA visible sans scroll). */
  .mk-hero-shape-mobile { display: none; }
  .mk-hero-text-col {
    position: absolute; inset: 0; height: 100%; width: 39%;
    display: flex; flex-direction: column; justify-content: center; gap: 12px;
    padding: 20px clamp(20px, 4vw, 56px); box-sizing: border-box;
  }
  .mk-hero-decor {
    position: absolute; top: 0; right: 0; width: 42%; height: 100%; pointer-events: none;
  }
  .mk-hero-decor > * { pointer-events: auto; }
  .mk-hero-secondary-row { display: flex; }
  .mk-hero-discount {
    top: 30%; right: 10%; width: 76px; height: 76px; z-index: 4;
    animation: mk-hero-promo-pulse 6s ease-in-out infinite;
  }

  /* ── Ken Burns — zoom/déplacement extrêmement discret, boucle 18s ── */
  .mk-hero-bg-img { animation: mk-hero-kenburns 18s ease-in-out infinite; will-change: transform; transform-origin: center; }
  @keyframes mk-hero-kenburns {
    0%   { transform: scale(1)     translate3d(0, 0, 0); }
    50%  { transform: scale(1.035) translate3d(-1%, -1%, 0); }
    100% { transform: scale(1)     translate3d(0, 0, 0); }
  }

  /* ── Badge remise flottant : pulse + glow discrets toutes les 6s ── */
  @keyframes mk-hero-promo-pulse {
    0%, 100% { transform: scale(1) rotate(0deg); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
    50%      { transform: scale(1.06) rotate(-3deg); box-shadow: 0 8px 28px rgba(220,38,38,.55), 0 0 24px rgba(220,38,38,.35); }
  }

  /* ── Boutons premium ── */
  .mk-hero-cta-btn {
    transition: transform 250ms cubic-bezier(.4,0,.2,1), box-shadow 250ms cubic-bezier(.4,0,.2,1), background 250ms;
  }
  .mk-hero-cta-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 32px rgba(0,0,0,.28);
    background: #FFF8F0 !important;
  }
  .mk-hero-cta-btn:active { transform: scale(.97); }

  .mk-hero-glass-btn {
    background: rgba(255,255,255,.18); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.35);
    transition: transform 250ms cubic-bezier(.4,0,.2,1), background 250ms;
  }
  .mk-hero-glass-btn:hover { transform: translateY(-2px); background: rgba(255,255,255,.26); }

  /* ── Micro-interactions ── */
  .mk-hero-cat-tile { transition: transform 200ms ease; }
  .mk-hero-cat-tile:hover { transform: scale(1.08); }
  .mk-hero-cat-tile:hover .mk-hero-cat-icon { transform: rotate(-6deg); }
  .mk-hero-cat-icon { transition: transform 200ms ease; }

  .mk-hero-card-float {
    background: rgba(255,255,255,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.6);
    transition: transform 220ms ease, box-shadow 220ms ease;
  }
  .mk-hero-card-float:hover { transform: translateY(-3px); box-shadow: 0 20px 44px rgba(0,0,0,.26); }

  /* ── Indicateurs de slide : pilule active + progression, points sinon ── */
  .mk-hero-dot {
    position: relative; height: 6px; border-radius: 3px; border: none; cursor: pointer; padding: 0;
    background: rgba(255,255,255,.5); transition: width 300ms ease, background 300ms ease; overflow: hidden;
  }
  .mk-hero-dot.active { width: 28px; background: rgba(255,255,255,.35); }
  .mk-hero-dot-progress {
    position: absolute; inset: 0; background: #fff; border-radius: 3px;
    transform-origin: left center; animation: mk-hero-dot-fill linear forwards;
  }
  @keyframes mk-hero-dot-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .mk-hero-root:hover .mk-hero-dot-progress { animation-play-state: paused; }

  @media (max-width: 899px) {
    .mk-hero { height: clamp(430px, 66vh, 580px) !important; }
    .mk-hero-shape-desktop { display: none; }
    .mk-hero-shape-mobile { display: block; }
    .mk-hero-text-col {
      position: absolute; inset: 0 0 auto 0; width: 100%; height: 46%; justify-content: flex-start;
      padding: 18px 20px 0;
    }
    .mk-hero-decor { display: none; }
    .mk-hero-illustration { display: none; }
    .mk-hero-secondary-row { display: none; }
    .mk-hero-discount { top: 52%; right: 6%; width: 60px; height: 60px; }
    .mk-hero-discount .mk-hero-discount-tag { font-size: 6px !important; }
    .mk-hero-discount .mk-hero-discount-value { font-size: 15px !important; }
    .mk-hero-discount .mk-hero-discount-label { font-size: 5px !important; padding: 0 3px !important; }
    /* Animations lourdes désactivées sur mobile — on garde fade/scale/slide uniquement */
    .mk-hero-bg-img { animation: none; }
    .mk-hero-parallax-layer { transform: none !important; }
  }

  /* ── Accessibilité : prefers-reduced-motion ── */
  @media (prefers-reduced-motion: reduce) {
    .mk-hero-bg-img { animation: none; }
    .mk-hero-discount { animation: none; }
    .mk-hero-parallax-layer { transform: none !important; }
    .mk-hero-cta-btn, .mk-hero-glass-btn, .mk-hero-cat-tile, .mk-hero-card-float { transition-duration: .01ms !important; }
    .mk-hero-cta-btn:hover, .mk-hero-glass-btn:hover { transform: none; }
  }

  /* ── Tablette 900px ── */
  @media (max-width: 900px) {
    /* Restaurant page : cacher la sidebar desktop */
    .rp-main-grid { grid-template-columns: 1fr !important; }
    .rp-cart-col { display: none !important; }

    /* Split vue carte tablette : carte sur pleine largeur, liste compacte au-dessus */
    .mk-map-layout {
      display: flex !important;
      flex-direction: column !important;
      height: calc(100vh - 130px) !important;
      min-height: 0 !important;
    }
    .mk-map-container { flex: 1 !important; height: auto !important; min-height: 260px !important; max-height: none !important; }
    .mk-map-list { flex-shrink: 0 !important; max-height: 180px !important; border-right: none !important; border-bottom: 1px solid var(--mk-border); }
  }

  /* ══════════════════════════════════════════════════════════
     MARKETPLACE — parcours "localisation d'abord" (carte toujours visible)
  ══════════════════════════════════════════════════════════ */
  .mk-map-top { transition: height .25s ease; }
  .mk-map-top-fullscreen {
    position: fixed !important;
    inset: 0 !important;
    z-index: 950 !important;
    border-radius: 0 !important;
    margin: 0 !important;
  }
  @media (max-width: 768px) {
    .mk-map-top:not(.mk-map-top-fullscreen) { height: 300px !important; }
    .mk-addr-pill span:nth-child(2) { max-width: 110px; }
  }
  @media (max-width: 480px) {
    .mk-addr-pill { max-width: 150px !important; padding: 7px 10px !important; }
    .mk-addr-pill span:nth-child(2) { max-width: 80px; }
  }

  /* ── Mobile 768px ── */
  @media (max-width: 768px) {
    /* Marketplace navbar : logo compact */
    .mk-logo-full { display: none !important; }
    .mk-logo-icon { display: block !important; }

    /* Checkout : empiler form + sidebar */
    .co-layout { flex-direction: column !important; padding: 16px 14px 88px !important; }
    .co-sidebar { width: 100% !important; position: static !important; top: auto !important; order: -1 !important; }
    .co-name-grid { grid-template-columns: 1fr !important; }
    .co-sidebar-submit { display: none !important; }

    /* Marketplace hero pills : scroll horizontal */
    .mk-hero-pills { justify-content: flex-start !important; flex-wrap: nowrap !important; overflow-x: auto !important; padding-bottom: 4px !important; }

    /* Restaurant info bar */
    .rp-main-grid { padding: 16px 14px 80px !important; }

    /* ── Vue carte mobile : plein écran + strip horizontal de cartes en bas ── */
    .mk-wrap.mk-mapview .mk-cat-strip { display: none !important; }

    .mk-map-layout {
      display: flex !important;
      flex-direction: column !important;
      height: calc(100vh - 191px) !important; /* 60px navbar + 55px filterbar + 76px bottom-bar */
      min-height: 0 !important;
    }
    /* Carte prend tout l'espace disponible */
    .mk-map-container {
      flex: 1 !important;
      height: auto !important;
      min-height: 200px !important;
      max-height: none !important;
      border-top: none !important;
    }
    /* Strip horizontal de cartes sous la carte */
    .mk-map-list {
      flex-shrink: 0 !important;
      flex-direction: row !important;
      overflow-x: auto !important;
      overflow-y: hidden !important;
      max-height: 130px !important;
      height: 130px !important;
      border-right: none !important;
      border-bottom: none !important;
      border-top: 1px solid var(--mk-border) !important;
      padding: 8px 10px !important;
      gap: 10px !important;
      background: var(--mk-surface) !important;
      -webkit-overflow-scrolling: touch !important;
      scrollbar-width: none !important;
    }
    .mk-map-list::-webkit-scrollbar { display: none; }
    /* Cartes horizontales compactes dans le strip */
    .mk-map-card {
      display: flex !important;
      flex-direction: row !important;
      width: 220px !important;
      min-width: 220px !important;
      height: 112px !important;
      flex-shrink: 0 !important;
      overflow: hidden !important;
    }
    .mk-map-card-cover {
      width: 80px !important;
      min-width: 80px !important;
      height: 100% !important;
      object-fit: cover !important;
      flex-shrink: 0 !important;
      border-radius: 0 !important;
    }
    .mk-map-card-cover-fb {
      width: 80px !important;
      min-width: 80px !important;
      height: 100% !important;
      flex-shrink: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-size: 24px !important;
    }
    .mk-map-card-body {
      padding: 8px 10px !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      min-width: 0 !important;
      flex: 1 !important;
    }
  }

  /* ── Mobile 480px ── */
  @media (max-width: 480px) {
    .mk-cart-label { display: none !important; }
    .mk-filter-bar { padding: 10px 0 !important; }

    /* Strip encore plus compact */
    .mk-map-card { width: 190px !important; min-width: 190px !important; }
  }

  /* ── Très petit mobile 375px ── */
  @media (max-width: 375px) {
    .co-layout { padding: 12px 10px 80px !important; }
    .mk-map-card { width: 170px !important; min-width: 170px !important; }
  }

  /* ─────────────────────────────────────────────────────
     LOYALTY PAGE — colonne détail responsive
  ───────────────────────────────────────────────────── */
  .rb-loyalty-split { grid-template-columns: 1fr 320px; }
  @media (max-width: 900px) {
    .rb-loyalty-split { grid-template-columns: 1fr !important; }
  }

  /* ── Reduced motion ── */
  @media (prefers-reduced-motion: reduce) {
    .mk-fade-up, .mk-fade-in { animation: none !important; }
    .mk-card { transition: none !important; }
  }

  /* ══════════════════════════════════════════════════════════
     MOBILE BOTTOM BAR — app-native style
  ══════════════════════════════════════════════════════════ */

  /* Bottom navigation bar (Marketplace) */
  .mk-bottom-bar {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 500;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--mk-border);
    padding: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-shadow: 0 -4px 24px rgba(0,0,0,.12);
  }
  .mk-bottom-tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 10px 2px 9px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--mk-muted);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    transition: color .15s, transform .12s;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    font-family: inherit;
  }
  .mk-bottom-tab:active { transform: scale(.86); }
  .mk-bottom-tab.active { color: var(--mk-orange); }
  .mk-bottom-tab-icon { font-size: 22px; line-height: 1.2; }
  .mk-bottom-badge {
    position: absolute;
    top: 7px;
    left: calc(50% + 5px);
    background: var(--mk-orange);
    color: #fff;
    font-size: 9px;
    font-weight: 800;
    min-width: 16px;
    height: 16px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    line-height: 1;
    box-shadow: 0 2px 6px rgba(234,88,12,.4);
  }

  /* Restaurant page — bottom cart bar */
  .rp-cart-bar {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 300;
    padding: 10px 14px;
    padding-bottom: max(10px, env(safe-area-inset-bottom, 10px));
    border-top: 1px solid var(--mk-border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 -4px 24px rgba(0,0,0,.12);
  }

  /* Checkout page — sticky confirm bar */
  .co-sticky-bar {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 300;
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom, 12px));
    background: rgba(255,255,255,.97);
    border-top: 1px solid #E2E8F0;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 -4px 24px rgba(0,0,0,.06);
  }

  @media (max-width: 768px) {
    /* Afficher les barres mobiles */
    .mk-bottom-bar  { display: flex !important; }
    .rp-cart-bar    { display: block !important; }
    .co-sticky-bar  { display: block !important; }

    /* Padding bas pour ne pas masquer le contenu derrière les barres fixes */
    .mk-wrap        { padding-bottom: 76px; }
    .rp-main-grid   { padding-bottom: 88px !important; }
    .co-layout      { padding-bottom: 88px !important; }

    /* Marketplace nav : cacher actions desktop (IA, panier, compte, thème) → bottom bar */
    .mk-nav-act          { display: none !important; }

    /* Bouton thème solo dans la navbar mobile */
    .mk-nav-magazine-mobile { display: inline-flex !important; }
    .mk-nav-theme-mobile { display: grid !important; }

    /* Bouton AI flottant : caché sur mobile (dans le bottom bar) */
    .mk-floating-ai { display: none !important; }

    /* Ancienne barre panier conditionnelle restaurant : remplacée */
    .rp-old-cart-bar { display: none !important; }

    /* Checkout : bouton confirm de la sidebar caché sur mobile (sticky bar prend le relais) */
    .co-sidebar-submit { display: none !important; }

    /* Marketplace filter bar : simplifier sur mobile */
    /* Le count et le toggle vue sont redondants (bottom bar a Explorer/Carte) */
    .mk-filter-count { display: none !important; }
    .mk-view-toggle  { display: none !important; }
  }

  /* ══════════════════════════════════════════════════════════
     DASHBOARD CONSOMMATEUR — sidebar desktop / bottom-nav mobile
     Prolonge le système mk (.mk-wrap) — réutilise .mk-bottom-bar et
     .mk-bottom-tab (déjà définis pour la Marketplace) pour la nav mobile.
  ══════════════════════════════════════════════════════════ */
  .ifd-shell { display: flex; min-height: 100vh; }
  .if-public-shell { min-height: 100vh; background: var(--mk-bg); color: var(--mk-text); }
  .if-public-main { min-height: 55vh; }
  .if-public-nav {
    position: sticky;
    top: 0;
    z-index: 420;
    min-height: 62px;
    padding: 0 clamp(12px,4vw,40px);
    display: flex;
    align-items: center;
    gap: 12px;
    background: color-mix(in srgb, var(--mk-surface) 94%, transparent);
    border-bottom: 1px solid var(--mk-border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }
  .if-public-brand {
    border: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
  }
  .if-public-links { display: flex; align-items: center; gap: 4px; margin-left: 10px; }
  .if-public-link {
    min-height: 40px;
    padding: 0 12px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--mk-text2);
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
  }
  .if-public-link:hover { background: var(--mk-pill); color: var(--mk-text); }
  .if-public-link.active { background: var(--mk-orange-light); color: var(--mk-orange); }
  .if-public-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .if-public-icon-btn,
  .if-public-cart,
  .if-public-account {
    min-height: 38px;
    border-radius: 10px;
    border: 1px solid var(--mk-border);
    background: var(--mk-surface);
    color: var(--mk-text);
    cursor: pointer;
    font-size: 13px;
    font-weight: 800;
  }
  .if-public-icon-btn { width: 38px; display: grid; place-items: center; }
  .if-public-cart { display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; }
  .if-public-cart strong { min-width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; background: var(--mk-orange); color: #fff; font-size: 10px; }
  .if-public-account { padding: 0 13px; }
  .if-user-menu { position: relative; }
  .if-user-menu-trigger {
    width: 38px; height: 38px; padding: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--mk-border); border-radius: 10px;
    background: var(--mk-orange); color: #fff; font-size: 14px; font-weight: 800;
    cursor: pointer;
  }
  .if-user-menu-trigger img { width: 100%; height: 100%; object-fit: cover; }
  .if-user-menu-panel {
    position: absolute; z-index: 60; top: calc(100% + 8px); inset-inline-end: 0; width: 250px;
    padding: 8px; border: 1px solid var(--mk-border); border-radius: 14px;
    background: var(--mk-surface); box-shadow: 0 16px 40px rgba(0,0,0,.16);

  .if-user-menu-header { display: flex; align-items: center; gap: 10px; padding: 8px 8px 12px; margin-bottom: 6px; border-bottom: 1px solid var(--mk-border); }
  .if-user-menu-avatar {
    width: 38px; height: 38px; flex: none; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px; background: var(--mk-orange); color: #fff; font-size: 14px; font-weight: 800;
  }
  .if-user-menu-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .if-user-menu-header div { min-width: 0; }
  .if-user-menu-header strong { display: block; overflow: hidden; color: var(--mk-text); font-size: 13.5px; text-overflow: ellipsis; white-space: nowrap; }
  .if-user-menu-header span { display: block; overflow: hidden; color: var(--mk-text2); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
  .if-user-menu-panel button {
    width: 100%; display: flex; align-items: center; gap: 10px; min-height: 38px;
    padding: 8px 9px; border: 0; border-radius: 9px; background: transparent;

  }
  .if-user-menu-panel button:hover { background: var(--mk-pill); color: var(--mk-text); }
  .if-user-menu-panel button svg { flex: none; color: var(--mk-text2); }

  .if-user-menu-logout { color: #ef4444 !important; }

  .if-public-footer {

  }

  .if-public-footer-col h2 { margin: 0 0 12px; font-size: 12px; font-weight: 900; color: var(--mk-text); text-transform: uppercase; letter-spacing: .06em; }
  .if-public-footer-col button {
    display: block;
    padding: 0;
    margin: 0 0 9px;
    border: 0;
    background: transparent;
    color: var(--mk-muted);
    font-size: 13px;
    font-weight: 700;
    text-align: left;
    cursor: pointer;

    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    color: var(--mk-muted);
    font-size: 12px;
    font-weight: 700;
  }
  @media (max-width: 860px) {
    .if-public-nav { flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
    .if-public-links { order: 3; width: 100%; margin-left: 0; overflow-x: auto; scrollbar-width: none; }
    .if-public-links::-webkit-scrollbar { display: none; }
    .if-public-actions { margin-left: auto; }

  @media (max-width: 560px) {

    .if-public-cart span, .if-public-account { font-size: 12px; }
    .if-public-account { padding: 0 10px; }
    .if-public-footer-inner { grid-template-columns: 1fr; gap: 22px; }

    width: 264px; flex-shrink: 0;

    margin-bottom: 2px;

  .ifd-sidebar-link:hover { background: var(--mk-pill); color: var(--mk-text); }
  .ifd-sidebar-link.active { background: var(--mk-orange-light); color: var(--mk-orange); }
  .ifd-sidebar-link .ifd-ico { font-size: 18px; width: 22px; text-align: center; flex-shrink: 0; }

    color: var(--mk-muted); padding: 16px 14px 6px;
  }
  .ifd-main { flex: 1; min-width: 0; }
  .ifd-topbar-mobile {
    display: none; position: sticky; top: 0; z-index: 200;

    background: var(--mk-surface); border-bottom: 1px solid var(--mk-border);
    backdrop-filter: blur(16px);
  }
  @media (max-width: 768px) {
    .ifd-sidebar { display: none; }
    .ifd-topbar-mobile { display: flex; }
    .ifd-content { padding-bottom: 90px !important; }
  }

  /* ── ProRegisterPage ─────────────────────────────────────────────────────── */
  @keyframes prr-spin { to { transform: rotate(360deg); } }

  .prr-brand-col { display: flex !important; }

  @media (max-width: 768px) {
    .prr-brand-col { display: none !important; }
  }

  /* ══════════════════════════════════════════════════════════
     IFILINO MAGAZINE (Discover) — refonte
     Prolonge le système .mk-* (cartes/pills/animations déjà définis
     ci-dessus, section "Marketplace Design System") plutôt que d'en
     recréer un nouveau — jamais de --mk-* orphelin, voir plan §9.
  ══════════════════════════════════════════════════════════ */
  .ifm-layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 28px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px clamp(14px, 4vw, 32px) 80px;
    align-items: start;
  }
  .ifm-sidebar { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 18px; }
  .ifm-sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
  .ifm-sidebar-link {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 12px;
    color: var(--mk-text2); text-decoration: none;
    font-size: 13px; font-weight: 600;
    transition: background .15s, color .15s;
  }
  .ifm-sidebar-link:hover { background: var(--mk-pill); color: var(--mk-text); text-decoration: none; }
  .ifm-sidebar-link.active { background: var(--mk-orange-light); color: var(--mk-orange); }
  .ifm-sidebar-link .ifm-ico { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
  .ifm-sidebar-count { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--mk-muted); }

  .ifm-widget { background: var(--mk-card); border: 1px solid var(--mk-border); border-radius: 16px; padding: 16px; box-shadow: var(--mk-shadow); }
  .ifm-widget-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--mk-muted); margin: 0 0 12px; }

  .ifm-app-widget { background: var(--mk-hero-gradient); color: #fff; border-color: transparent; }
  .ifm-app-widget .ifm-widget-title { color: rgba(255,255,255,.85); }
  .ifm-app-widget ul { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
  .ifm-app-widget li::before { content: '✓ '; font-weight: 700; }
  .ifm-app-btn {
    display: block; width: 100%; text-align: center; padding: 10px; border-radius: 10px;
    background: #fff; color: var(--mk-orange); font-weight: 700; font-size: 13px;
    border: none; cursor: pointer; transition: transform .15s;
  }
  .ifm-app-btn:hover { transform: translateY(-1px); }

  .ifm-newsletter-form { display: flex; gap: 6px; margin-top: 4px; }
  .ifm-newsletter-form input { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--mk-border); font-size: 12px; }
  .ifm-newsletter-form button { padding: 8px 12px; border-radius: 10px; border: none; background: var(--mk-orange); color: #fff; font-weight: 700; cursor: pointer; flex-shrink: 0; }

  .ifm-mini-article { display: flex; gap: 10px; text-decoration: none; color: inherit; padding: 6px 0; }
  .ifm-mini-article:hover .ifm-mini-title { color: var(--mk-orange); }
  .ifm-mini-article img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: var(--mk-border2); }
  .ifm-mini-title { font-size: 12px; font-weight: 700; line-height: 1.35; color: var(--mk-text); transition: color .15s; }
  .ifm-mini-date { font-size: 11px; color: var(--mk-muted); margin-top: 2px; }

  .ifm-tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; }

  .ifm-main { min-width: 0; }
  .ifm-header-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .ifm-search { flex: 1; min-width: 200px; max-width: 420px; position: relative; }
  .ifm-search input { width: 100%; padding: 10px 14px 10px 38px; border-radius: 24px; border: 1px solid var(--mk-border); font-size: 13px; background: var(--mk-surface); }
  .ifm-search::before { content: '🔎'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; opacity: .5; }

  .ifm-article-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 18px; }

  /* Hauteur du conteneur pilotée par aspect-ratio/min-height, PAS par la
     taille naturelle de l'image (16:9, ~1600x900) — sur mobile, une largeur
     étroite fait s'effondrer un ratio 16:9 à ~200px, trop court pour le
     titre+résumé+CTA de l'overlay, qui débordait alors en haut du cadre. */
  .ifm-hero { border-radius: 20px; overflow: hidden; position: relative; margin-bottom: 24px; box-shadow: var(--mk-shadow-lg); aspect-ratio: 16 / 7; min-height: 280px; }
  .ifm-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .ifm-hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(8,17,31,.82) 0%, rgba(8,17,31,.15) 55%, transparent 100%);
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 28px clamp(18px,4vw,40px);
  }
  .ifm-hero-title { color: #fff; font-family: 'Poppins', sans-serif; font-weight: 800; font-size: clamp(24px,3.4vw,40px); line-height: 1.15; margin: 0 0 8px; text-shadow: 0 2px 12px rgba(0,0,0,.3); }
  .ifm-hero-excerpt { color: rgba(255,255,255,.9); font-size: 14px; max-width: 640px; margin: 0 0 16px; }
  .ifm-hero-cta { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 12px; background: var(--mk-orange); color: #fff; font-weight: 700; font-size: 13px; text-decoration: none; width: fit-content; transition: transform .15s; }
  .ifm-hero-cta:hover { transform: translateY(-2px); color: #fff; }

  @media (max-width: 600px) {
    .ifm-hero { aspect-ratio: auto; min-height: 340px; }
    .ifm-hero-overlay { padding: 20px 18px; }
    .ifm-hero-title { font-size: 21px; margin-bottom: 6px; }
    .ifm-hero-excerpt {
      font-size: 12.5px; margin-bottom: 12px;
      display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .ifm-hero-cta { padding: 9px 16px; font-size: 12px; }
  }

  .ifm-article-meta-bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--mk-muted); margin-bottom: 18px; }
  .ifm-share-row { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .ifm-share-btn {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: var(--mk-pill); color: var(--mk-text2); text-decoration: none; font-size: 13px;
    border: 0; padding: 0; cursor: pointer; appearance: none;
    transition: transform .15s, background .15s;
  }
  .ifm-share-btn svg { width: 16px; height: 16px; display: block; fill: currentColor; }
  .ifm-share-btn--facebook { color: #1877F2; }
  .ifm-share-btn--x { color: #111827; }
  .ifm-share-btn--whatsapp { color: #128C7E; }
  .ifm-share-btn--instagram { color: #C13584; }
  .ifm-share-btn--native { color: var(--mk-orange); }
  .ifm-share-btn--link { color: var(--mk-muted); }
  .ifm-share-btn:hover { transform: translateY(-2px); background: var(--mk-orange-light); color: var(--mk-orange); }

  .ifm-toc { background: var(--mk-surface); border: 1px solid var(--mk-border); border-radius: 16px; padding: 16px 18px; margin-bottom: 24px; }
  .ifm-toc-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--mk-muted); margin: 0 0 10px; }
  .ifm-toc ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .ifm-toc li[data-level="3"] { padding-left: 16px; }
  .ifm-toc a { color: var(--mk-text2); text-decoration: none; font-size: 13px; }
  .ifm-toc a:hover { color: var(--mk-orange); }

  .ifm-body { font-size: 15.5px; line-height: 1.75; color: var(--mk-text); }
  .ifm-body h2 { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 22px; margin: 32px 0 14px; scroll-margin-top: 90px; }
  .ifm-body h3 { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 17px; margin: 24px 0 10px; scroll-margin-top: 90px; }
  .ifm-body p { margin: 0 0 14px; }
  .ifm-body ul, .ifm-body ol { margin: 0 0 14px; padding-left: 22px; }
  .ifm-body li { margin-bottom: 4px; }
  .ifm-body img { max-width: 100%; border-radius: 14px; margin: 10px 0; }
  .ifm-body blockquote {
    margin: 20px 0; padding: 16px 18px; border-radius: 14px;
    background: linear-gradient(135deg, rgba(255,138,0,.10), rgba(34,197,94,.08));
    border: 1px solid rgba(255,138,0,.18); border-left: 4px solid var(--mk-orange);
    font-size: 14px; color: var(--mk-text2); box-shadow: 0 10px 26px rgba(15,23,42,.05);
  }
  .ifm-body blockquote p:last-child { margin-bottom: 0; }

  .ifm-faq { margin: 32px 0; display: flex; flex-direction: column; gap: 10px; }
  .ifm-faq-item { border: 1px solid var(--mk-border); border-radius: 14px; overflow: hidden; background: var(--mk-surface); }
  .ifm-faq-question {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 16px; cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--mk-text);
    list-style: none;
  }
  .ifm-faq-question::-webkit-details-marker { display: none; }
  .ifm-faq-question::after { content: '+'; font-size: 18px; font-weight: 400; color: var(--mk-muted); transition: transform .2s; flex-shrink: 0; }
  details[open] > .ifm-faq-question::after { transform: rotate(45deg); }
  .ifm-faq-answer { padding: 0 16px 16px; font-size: 13.5px; color: var(--mk-text2); line-height: 1.6; }

  .ifm-gallery { margin: 28px 0; }
  .ifm-gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 14px; }
  .ifm-gallery-item { margin: 0; border-radius: 16px; overflow: hidden; background: var(--mk-border2); box-shadow: var(--mk-shadow); }
  .ifm-gallery-item img { width: 100%; height: 220px; object-fit: cover; display: block; }
  .ifm-gallery-item figcaption { padding: 10px 12px; font-size: 12.5px; font-weight: 600; color: var(--mk-text2); }

  .ifm-business-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 14px; margin: 20px 0 32px; }
  .ifm-business-card { display: block; text-decoration: none; color: inherit; }
  .ifm-business-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 14px 14px 0 0; background: var(--mk-border2); }
  .ifm-business-card-body { padding: 12px; }
  .ifm-business-card-name { font-size: 13px; font-weight: 700; color: var(--mk-text); margin: 0 0 4px; }
  .ifm-business-card-meta { font-size: 11.5px; color: var(--mk-muted); margin: 0 0 4px; }
  .ifm-business-card-cta { display: inline-flex; margin-top: 8px; color: var(--mk-orange); font-size: 12px; font-weight: 800; }

  .ifm-kicker { margin: 0 0 6px; color: var(--mk-orange); font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; }
  .ifm-conversion-block, .ifm-final-cta, .ifm-sources { margin: 34px 0; padding: 20px; border: 1px solid var(--mk-border); border-radius: 18px; background: var(--mk-surface); box-shadow: var(--mk-shadow); }
  .ifm-conversion-block h2, .ifm-final-cta h2, .ifm-sources h2 { margin: 0 0 12px; font-size: 20px; font-weight: 800; }
  .ifm-promo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .ifm-promo-card { display: flex; flex-direction: column; gap: 4px; padding: 14px; border-radius: 14px; background: var(--mk-pill); color: inherit; text-decoration: none; }
  .ifm-promo-card strong { color: var(--mk-orange); font-size: 17px; }
  .ifm-promo-card span { font-size: 13px; font-weight: 700; color: var(--mk-text); }
  .ifm-promo-card small { font-size: 11px; color: var(--mk-muted); }
  .ifm-final-cta { display: flex; align-items: center; justify-content: space-between; gap: 18px; background: linear-gradient(135deg, rgba(255,138,0,.10), rgba(59,130,246,.08)); }
  .ifm-final-cta p:last-child { margin: 0; color: var(--mk-muted); }
  .ifm-sources ul { margin: 0; padding-left: 18px; }
  .ifm-sources a { color: var(--mk-text2); font-weight: 700; }
  .ifm-promo-mini { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: var(--mk-pill); color: inherit; text-decoration: none; }
  .ifm-promo-mini img { width: 34px; height: 34px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  .ifm-promo-mini span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ifm-promo-mini strong { color: var(--mk-orange); font-size: 12px; }
  .ifm-promo-mini small { color: var(--mk-muted); font-size: 11px; line-height: 1.3; }

  .ifm-footer {
    border-top: 1px solid var(--mk-border);
    background: var(--mk-surface);
    padding: 36px clamp(14px,4vw,32px) 42px;
  }
  .ifm-footer-inner {
    max-width: 1280px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(220px, 1.35fr) repeat(3, minmax(140px, .75fr));
    gap: 28px;
  }
  .ifm-footer-brand {
    display: inline-flex;
    color: var(--mk-text);
    font-size: 18px;
    font-weight: 900;
    text-decoration: none;
    margin-bottom: 10px;
  }
  .ifm-footer p { margin: 0; max-width: 340px; color: var(--mk-muted); font-size: 13px; line-height: 1.65; }
  .ifm-footer h2 { margin: 0 0 12px; color: var(--mk-text); font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; }
  .ifm-footer a { display: block; color: var(--mk-muted); font-size: 13px; font-weight: 600; text-decoration: none; margin-bottom: 8px; }
  .ifm-footer a:hover { color: var(--mk-orange); text-decoration: none; }

  @media (max-width: 900px) {
    .ifm-nav-inner { min-height: 88px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
    .ifm-nav-links { order: 3; width: 100%; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .ifm-nav-links::-webkit-scrollbar { display: none; }
    .ifm-nav-actions { margin-left: auto; }
    .ifm-layout { grid-template-columns: 1fr; }
    .ifm-sidebar { position: static; order: 2; }
    .ifm-main { order: 1; }
    .ifm-footer-inner { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    .ifm-nav-logo { height: 72px !important; max-width: 210px; }
    .ifm-nav-ghost { display: none; }
    .ifm-nav-primary { min-height: 38px; padding: 0 12px; font-size: 12px; }
    .ifm-final-cta { align-items: stretch; flex-direction: column; }
    .ifm-footer-inner { grid-template-columns: 1fr; gap: 22px; }
  }
  </style>
</head>
