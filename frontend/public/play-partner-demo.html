<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Tap</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07111f;color:#fff;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.game{position:relative;width:min(100vw,900px);height:100dvh;max-height:720px;overflow:hidden;background:radial-gradient(circle at 50% 15%,#213353,#07111f 65%);touch-action:manipulation}.hud{position:absolute;z-index:2;inset:0 0 auto;display:flex;justify-content:space-between;padding:18px;font-weight:800}.hud span{padding:8px 12px;border:1px solid #ffffff26;border-radius:12px;background:#07111fcc}.target{position:absolute;width:76px;height:76px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7c2,#ff8a00 40%,#ff2d2d);box-shadow:0 0 0 10px #ff8a0022,0 12px 36px #0008;cursor:pointer}.panel{position:absolute;z-index:3;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;padding:24px;text-align:center;background:#07111fdd}.panel h1{margin:0;font-size:clamp(2rem,8vw,4.5rem)}.panel p{max-width:520px;margin:0;color:#cbd5e1;line-height:1.6}.panel button{min-height:50px;padding:0 24px;border:0;border-radius:14px;background:#ff6a00;color:#fff;font:inherit;font-weight:900;cursor:pointer}.hidden{display:none}
</style></head><body><main class="game" aria-label="Orbit Tap"><div class="hud"><span id="score">Score 0</span><span id="time">30 s</span></div><button id="target" class="target hidden" type="button" aria-label="Toucher la cible"></button><section id="panel" class="panel"><h1>Orbit Tap</h1><p>Touchez la cible autant de fois que possible en 30 secondes. Compatible souris, clavier et écran tactile.</p><button id="start" type="button">Commencer</button></section></main><script>
const game=document.querySelector('.game'),target=document.querySelector('#target'),panel=document.querySelector('#panel'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),start=document.querySelector('#start');let score=0,time=30,timer;function move(){const s=76,p=18,x=p+Math.random()*(game.clientWidth-s-p*2),y=70+Math.random()*(game.clientHeight-s-90);target.style.transform=`translate(${x}px,${y}px)`}function hit(){score++;scoreEl.textContent=`Score ${score}`;move()}function begin(){score=0;time=30;scoreEl.textContent='Score 0';timeEl.textContent='30 s';panel.classList.add('hidden');target.classList.remove('hidden');move();clearInterval(timer);timer=setInterval(()=>{time--;timeEl.textContent=`${time} s`;if(time<=0){clearInterval(timer);target.classList.add('hidden');panel.classList.remove('hidden');panel.querySelector('h1').textContent=`Score : ${score}`;panel.querySelector('p').textContent='Belle partie ! Rejouez pour améliorer votre score.';start.textContent='Rejouer'}},1000)}target.addEventListener('click',hit);start.addEventListener('click',begin);
</script></body></html>
