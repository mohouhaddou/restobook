# Nginx vhost — ifilino.com
# À copier dans /etc/nginx/sites-available/ifilino.conf
# Puis : sudo ln -s /etc/nginx/sites-available/ifilino.conf /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx

# ── HTTP → HTTPS ──────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ifilino.com www.ifilino.com;
    return 301 https://ifilino.com$request_uri;
}

# ── HTTPS ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ifilino.com www.ifilino.com;

    ssl_certificate     /etc/letsencrypt/live/ifilino.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ifilino.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # www → non-www
    if ($host = www.ifilino.com) {
        return 301 https://ifilino.com$request_uri;
    }

    root /var/www/restobook/backend/public;
    # Comic packages may contain hundreds of high-resolution pages.
    # 260 MiB covers the 250 MiB API limit plus multipart framing.
    client_max_body_size 260m;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # geolocation=(self) : la marketplace utilise activement la position
    # (recherche "près de moi", voir MarketplacePage.jsx) — geolocation=()
    # bloquait l'API navigator.geolocation au niveau du navigateur, quelle
    # que soit l'autorisation déjà accordée par l'utilisateur.
    add_header Permissions-Policy "geolocation=(self), microphone=()" always;

    # ── API → Node.js port 3000 ──────────────────────────────────────────
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Fichiers uploadés ─────────────────────────────────────────────────
    location ^~ /uploads/ {
        alias /var/www/restobook/backend/uploads/;
        autoindex off;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Vary "Origin" always;
    }

    # ── Logos / brand ─────────────────────────────────────────────────────
    location ^~ /brand/ {
        alias /var/www/restobook/backend/public/brand/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Assets Vite (fingerprinted, cache agressif) ───────────────────────
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Fichiers statiques génériques ─────────────────────────────────────
    location ~* \.(?:js|mjs|css|woff2?|ttf|svg|png|jpe?g|webp|gif|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── index.html : jamais mis en cache (SPA) ───────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── SEO ───────────────────────────────────────────────────────────────
    # robots.txt reste un fichier statique (change rarement). sitemap.xml
    # n'a PAS de location dédiée : il n'existe plus sur disque (généré
    # dynamiquement par Node, voir backend/src/modules/seo/sitemapService.js)
    # donc il retombe naturellement dans le bloc `location /` ci-dessous, qui
    # route déjà tout URI absent du disque vers @app.
    location = /robots.txt  { try_files $uri =404; access_log off; }
    location = /manifest.json { try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; log_not_found off; }

    # ── Pages (React Router + SSR) ──────────────────────────────────────────
    # Node décide lui-même s'il sert du SSR pour une page publique connue ou
    # le fallback SPA classique index.html (voir backend/index.js) — nginx ne
    # sait donc plus résoudre ces requêtes en local, contrairement à avant.
    # PAS de `$uri/` ici : sur `/`, ça correspondrait à la racine du site
    # (répertoire existant) et nginx servirait index.html directement via son
    # mécanisme d'index de répertoire (actif par défaut même sans directive
    # `index` explicite) — @app ne serait jamais atteint, donc jamais de SSR
    # sur la page d'accueil. Seul `$uri` (fichier exact) est vérifié ; tout le
    # reste retombe sur @app, qui décide lui-même SSR vs SPA classique.
    location / {
        try_files $uri @app;
    }

    # ── Proxy Node (pages publiques SSR + fallback SPA + sitemaps) ─────────
    # Séparé du bloc ^~ /api/ ci-dessus : celui-ci n'a pas besoin des en-têtes
    # Upgrade/Connection (pas de WebSocket ici), et route explicitement vers
    # la racine de l'app Node plutôt que vers /api/.
    location @app {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
